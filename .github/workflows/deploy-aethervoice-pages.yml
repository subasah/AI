name: Deploy AetherVoice admin to GitHub Pages

on:
  push:
    branches: [main, cursor/agnostic-voice-agent-platform-2e46]
    paths:
      - "voice-agent-platform/frontend/**"
      - ".github/workflows/deploy-aethervoice-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-aethervoice
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voice-agent-platform/frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /AI/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ vars.VITE_ADMIN_TOKEN }}
        run: npm run build
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: voice-agent-platform/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
