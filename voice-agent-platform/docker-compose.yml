# AetherVoice full stack — Nginx + React + FastAPI + MySQL
# Usage:
#   cp .env.docker.example .env.docker   # edit credentials / API keys
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker down

services:
  mysql:
    image: mysql:8.4
    container_name: aethervoice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aethervoice}
      MYSQL_USER: ${MYSQL_USER:-aethervoice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aethervoice_pass_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aethervoice-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER:-aethervoice}",
          "-p${MYSQL_PASSWORD:-aethervoice_pass_change_me}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aethervoice-backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      RELOAD: "false"
      STORE_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aethervoice}
      MYSQL_USER: ${MYSQL_USER:-aethervoice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aethervoice_pass_change_me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:-dev-admin-token}
      # Voice / telephony tokens — sourced from .env.docker on the VPS (never from git)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aethervoice-net
    # Backend is internal-only; Nginx is the public entrypoint
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_ADMIN_TOKEN: ${ADMIN_ACCESS_TOKEN:-dev-admin-token}
        VITE_BASE_PATH: /
    container_name: aethervoice-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aethervoice-net

networks:
  aethervoice-net:
    driver: bridge
    name: aethervoice-net

volumes:
  mysql_data:
    name: aethervoice-mysql-data
